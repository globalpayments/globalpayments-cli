id: sale-delayed-capture-auth
name: "Sale: Pre-Authorize (capture_mode: LATER) — Form Q10 / Q16"
required: true
formQuestion: 16
observability: polling
tags:
  - sale
  - authorize
  - delayed-capture
  - form-required
mode: latest
# Form Q10: Confirms capture_mode: LATER is subsequently captured (see sale-delayed-capture-capture).
# Form Q16: Process a Pre-Authorized transaction of amount 100. Then CAPTURE the transaction.
# This pack uses amount 1001 to uniquely identify this transaction during polling.
matcher:
  type: SALE
  channel: CNP
  amount: 1001
expect:
  latest:
    statusIn:
      - PREAUTHORIZED
    responseCodeIn:
      - "SUCCESS"
evaluator:
  type: declarative
