id: transfer-create
name: "Transfer funds between merchants — POST /merchants/{id}/transfers"
scenario: "Call POST /merchants/{id}/transfers."
required: false
source: actions
observability: polling
tags:
  - platform
  - action-type-inferred
mode: latest
# Action type inferred from GP naming conventions and not yet observed. If this case stays pending with MATCHER_MISMATCH, `globalpayments diagnose` shows the action type GP actually logged; update matcher.type to it.
matcher:
  type: TRANSFER_OUT
  resource: TRANSFERS
expect:
  latest:
    responseCodeIn:
      - "200"
      - "201"
evaluator:
  type: declarative
